<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Estimation Corrector</title>
<meta name="description" content="Give it your honest dev estimate. It applies the multipliers you already know are real." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="app">
    <header class="hero">
      <div class="badge">⏱ estimate ≠ reality</div>
      <h1>The Estimation Corrector</h1>
      <p class="tagline">Every dev lowballs. Give it your honest guess — it applies the tax you already know is coming.</p>
    </header>

    <main class="card">
      <label class="field-label" for="taskInput">What are you building?</label>
      <textarea id="taskInput" rows="2" placeholder="Just add a small settings toggle, should be quick"></textarea>

      <div class="estimate-row">
        <div class="estimate-field">
          <label class="field-label" for="amountInput">Your honest estimate</label>
          <input type="number" id="amountInput" min="0" step="0.5" value="1" />
        </div>
        <div class="estimate-field">
          <label class="field-label" for="unitInput">Unit</label>
          <select id="unitInput">
            <option value="hours" selected>hours</option>
            <option value="days">days</option>
            <option value="minutes">minutes</option>
          </select>
        </div>
      </div>

      <div class="examples">
        <span>Try:</span>
        <button class="chip" data-task="Just add a small settings toggle, should be quick" data-amount="1" data-unit="hours">settings toggle</button>
        <button class="chip" data-task="Quick CSS fix on the client's homepage, one small change" data-amount="30" data-unit="minutes">CSS fix</button>
        <button class="chip" data-task="Simple database migration and refactor of the auth module" data-amount="4" data-unit="hours">migration + refactor</button>
        <button class="chip" data-task="Write unit tests for the payment module" data-amount="1" data-unit="days">no red flags</button>
      </div>

      <button id="correctBtn" class="primary-btn">Correct my estimate</button>

      <section id="result" class="result hidden">
        <div class="receipt" id="receipt"></div>
      </section>
    </main>

    <footer class="foot">
      Fully rule-based, runs in your browser. Nothing you type is sent anywhere.
    </footer>
  </div>

  <script src="particles.js"></script>
  <script src="script.js"></script>
</body>
</html>
